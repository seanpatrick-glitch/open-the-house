# This file tells GitHub: "Every time code is pushed to the main branch,
# automatically build the app and deploy it to the main Firebase Hosting site
# (open-the-house.web.app)." Beta testers are on a separate site — see
# firebase-deploy-beta.yml, which only fires on pushes to beta-stable.
#
# main and beta-stable intentionally share one Firebase project and one
# Firestore database — rules, indexes, and functions are project-wide, not
# per-site, so this workflow deploys them too (in addition to hosting:main)
# on every push to main. firebase-deploy-beta.yml deploys hosting:beta only
# and deliberately does NOT repeat this, to avoid two workflows racing to
# deploy the same shared rules/indexes/functions.
# You do NOT need to edit this file manually.

name: Deploy to Firebase Hosting (main)

on:
  push:
    branches:
      - main   # fires when you push to the main branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install all packages
      - name: Install dependencies
        run: npm ci

      # Step 4: Build the app (creates the "dist" folder)
      # The Firebase config values are stored as GitHub Secrets (Settings → Secrets)
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Step 5: Deploy Firestore rules, Firestore indexes, Cloud Functions, and
      # the main Hosting site. Rules/indexes/functions are project-wide (not
      # per-site), so they belong here, not duplicated in the beta workflow.
      # Same FIREBASE_TOKEN already used for the hosting-only deploy — no new
      # auth needed, it just needs to cover these additional deploy targets.
      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules,firestore:indexes,functions,hosting:main --token "${{ secrets.FIREBASE_TOKEN }}" --project open-the-house
