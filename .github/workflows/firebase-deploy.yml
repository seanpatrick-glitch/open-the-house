# This file tells GitHub: "Every time code is pushed to the main branch,
# automatically build the app and deploy it to the main Firebase Hosting site
# (open-the-house.web.app)." Beta testers are on a separate site — see
# firebase-deploy-beta.yml, which only fires on pushes to beta-stable.
#
# main and beta-stable intentionally share one Firebase project and one
# Firestore database — rules, indexes, and functions are project-wide, not
# per-site, so this workflow deploys them too (in addition to hosting:main)
# on every push to main. firebase-deploy-beta.yml deploys hosting:beta only
# and deliberately does NOT repeat this, to avoid two workflows racing to
# deploy the same shared rules/indexes/functions.
#
# Authenticates via the FIREBASE_SERVICE_ACCOUNT secret (a GCP service
# account key) through google-github-actions/auth, not the deprecated
# `firebase login:ci` FIREBASE_TOKEN method — see PROJECT_STATE.md for why
# that token was retired (it couldn't reliably deploy Firestore rules/
# indexes/functions from CI, only Hosting).
# You do NOT need to edit this file manually.

name: Deploy to Firebase Hosting (main)

on:
  push:
    branches:
      - main   # fires when you push to the main branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      # Pinned to 24, matching functions/package.json's declared engines.node
      # ("24") — the functions deploy step below loads functions/index.js
      # locally to introspect what to deploy, and a mismatch here is the
      # likely cause of this job's Firestore/functions deploy step failing
      # in CI (exit code 2) while the identical command succeeded locally
      # under Node v24. See PROJECT_STATE.md for the investigation.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Step 3: Install all packages
      - name: Install dependencies
        run: npm ci

      # Step 4: Build the app (creates the "dist" folder)
      # The Firebase config values are stored as GitHub Secrets (Settings → Secrets)
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Step 5: Authenticate to Google Cloud using the FIREBASE_SERVICE_ACCOUNT
      # secret (a GCP service account key with Firebase Admin, Cloud Functions
      # Admin, Artifact Registry Administrator, Cloud Build Editor, and Service
      # Account User roles), replacing the deprecated `firebase login:ci`
      # FIREBASE_TOKEN method entirely. This action writes the key to a temp
      # file and sets GOOGLE_APPLICATION_CREDENTIALS — firebase-tools picks it
      # up automatically on every command below, no --token flag needed.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Step 6: Deploy Hosting first, on its own — this is the one target that
      # has always worked from CI, and must keep working even if something
      # about the newer targets below ever fails, so it is never blocked by
      # them (a single combined --only list with hosting last was tried and
      # found to abort before reaching hosting when a later target failed —
      # see PROJECT_STATE.md for the incident this avoids repeating).
      - name: Deploy Hosting
        run: firebase deploy --only hosting:main --project open-the-house

      # Step 7: Deploy Firestore rules, Firestore indexes, and Cloud Functions
      # — project-wide (not per-site), so they belong here, not duplicated in
      # the beta workflow. Kept as its own step, after Hosting succeeds, so a
      # failure here is isolated and doesn't cost the live site its deploy.
      - name: Deploy Firestore rules, indexes, and functions
        run: firebase deploy --only firestore:rules,firestore:indexes,functions --project open-the-house
