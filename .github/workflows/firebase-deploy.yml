# This file tells GitHub: "Every time code is pushed to the main branch,
# automatically build the app and deploy it to the main Firebase Hosting site
# (open-the-house.web.app)." Beta testers are on a separate site — see
# firebase-deploy-beta.yml, which only fires on pushes to beta-stable.
#
# main and beta-stable intentionally share one Firebase project, one
# Firestore database, and one Storage bucket — rules, indexes, functions,
# and Storage rules are all project-wide, not per-site, so this workflow
# deploys them too (in addition to hosting:main) on every push to main.
# firebase-deploy-beta.yml deploys hosting:beta only (plus its own minimal
# Storage-rules step — see that file) and deliberately does NOT repeat the
# Firestore rules/indexes/functions deploy, to avoid two workflows racing
# to deploy the same shared resources.
#
# Authenticates via the FIREBASE_SERVICE_ACCOUNT secret (a GCP service
# account key) through google-github-actions/auth, not the deprecated
# `firebase login:ci` FIREBASE_TOKEN method — see PROJECT_STATE.md for why
# that token was retired (it couldn't reliably deploy Firestore rules/
# indexes/functions from CI, only Hosting).
# You do NOT need to edit this file manually.

name: Deploy to Firebase Hosting (main)

on:
  push:
    branches:
      - main   # fires when you push to the main branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      # Pinned to 24, matching functions/package.json's declared engines.node
      # ("24"). (This was tried as a fix for the functions deploy failure
      # investigated in PROJECT_STATE.md — it wasn't the actual cause, see
      # the "Install functions dependencies" step below for what was, but
      # matching the declared engine is still correct to keep.)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Step 3: Install all packages
      - name: Install dependencies
        run: npm ci

      # Step 4: Build the app (creates the "dist" folder)
      # The Firebase config values are stored as GitHub Secrets (Settings → Secrets)
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Step 5: Authenticate to Google Cloud using the FIREBASE_SERVICE_ACCOUNT
      # secret (a GCP service account key with Firebase Admin, Cloud Functions
      # Admin, Artifact Registry Administrator, Cloud Build Editor, and Service
      # Account User roles), replacing the deprecated `firebase login:ci`
      # FIREBASE_TOKEN method entirely. This action writes the key to a temp
      # file and sets GOOGLE_APPLICATION_CREDENTIALS — firebase-tools picks it
      # up automatically on every command below, no --token flag needed.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Step 5.5: Install functions/'s own dependencies. This is the actual
      # root cause of every Firestore/functions CI deploy failure so far
      # (confirmed from the real log, not guessed): `firebase deploy` loads
      # functions/index.js locally to introspect what to deploy, which
      # requires firebase-functions/firebase-admin to be installed — but the
      # root "Install dependencies" step above only ever ran `npm ci` at the
      # repo root, which does not touch functions/'s separate package.json.
      # Locally this always worked because functions/node_modules already
      # existed from a prior local `npm install`; CI does a fresh checkout
      # every run, so it never existed there at all.
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      # Step 6: Deploy Hosting first, on its own — this is the one target that
      # has always worked from CI, and must keep working even if something
      # about the newer targets below ever fails, so it is never blocked by
      # them (a single combined --only list with hosting last was tried and
      # found to abort before reaching hosting when a later target failed —
      # see PROJECT_STATE.md for the incident this avoids repeating).
      - name: Deploy Hosting
        run: firebase deploy --only hosting:main --project open-the-house

      # Step 7: Deploy Firestore rules, Firestore indexes, Cloud Functions, and
      # Storage rules — all project-wide (not per-site), so they belong here,
      # not duplicated in the beta workflow (beta gets its own minimal
      # Storage-only step instead, since it doesn't otherwise touch this
      # project-wide scope). Kept as its own step, after Hosting succeeds, so
      # a failure here is isolated and doesn't cost the live site its deploy.
      # Storage added 2026-08-19, once the project's Storage bucket was
      # actually provisioned (a one-time manual Console step) — before that,
      # `--only storage` failed outright and would have broken this whole
      # step for every push, the same false-negative failure mode already
      # hit once before with Firestore/functions (see PROJECT_STATE.md).
      - name: Deploy Firestore rules, indexes, functions, and storage
        run: firebase deploy --only firestore:rules,firestore:indexes,functions,storage --project open-the-house
