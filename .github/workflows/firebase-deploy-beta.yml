# This file tells GitHub: "Every time code is pushed to the beta-stable branch,
# automatically build the app and deploy it to the beta Firebase Hosting site
# (placespeople-beta-testing.web.app)." This is the site your beta tester uses,
# kept separate from main so in-progress work on main never reaches them.
#
# Deliberately hosting:beta only — main and beta-stable share one Firebase
# project and one Firestore database, so rules, indexes, and functions are
# project-wide, not per-site. firebase-deploy.yml (the main-branch workflow)
# already deploys those on every push to main; duplicating it here would risk
# two workflows racing to deploy the same shared resources for no benefit.
# You do NOT need to edit this file manually.

name: Deploy to Firebase Hosting (beta)

on:
  push:
    branches:
      - beta-stable   # fires when you push to the beta-stable branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install all packages
      - name: Install dependencies
        run: npm ci

      # Step 4: Build the app (creates the "dist" folder)
      # The Firebase config values are stored as GitHub Secrets (Settings → Secrets)
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Step 5: Deploy to Firebase Hosting (beta site only — not the main site)
      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:beta --token "${{ secrets.FIREBASE_TOKEN }}" --project open-the-house
