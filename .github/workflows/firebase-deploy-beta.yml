# This file tells GitHub: "Every time code is pushed to the beta-stable branch,
# automatically build the app and deploy it to the beta Firebase Hosting site
# (placespeople-beta-testing.web.app)." This is the site your beta tester uses,
# kept separate from main so in-progress work on main never reaches them.
#
# Deliberately hosting:beta only, plus one exception below — main and
# beta-stable share one Firebase project, one Firestore database, and one
# Storage bucket, so Firestore rules/indexes/functions are project-wide, not
# per-site. firebase-deploy.yml (the main-branch workflow) already deploys
# those on every push to main; duplicating them here would risk two
# workflows racing to deploy the same shared resources for no benefit.
#
# Storage rules are the one exception (added 2026-08-19): this workflow
# deploys `storage` on its own, even though it skips Firestore rules/
# indexes/functions, so a beta-only push still keeps the shared Storage
# rules current without pulling in the rest of that project-wide scope.
#
# Authenticates via the FIREBASE_SERVICE_ACCOUNT secret (a GCP service
# account key) through google-github-actions/auth, not the deprecated
# `firebase login:ci` FIREBASE_TOKEN method — matches firebase-deploy.yml,
# no reason to leave one workflow on the retired method.
# You do NOT need to edit this file manually.

name: Deploy to Firebase Hosting (beta)

on:
  push:
    branches:
      - beta-stable   # fires when you push to the beta-stable branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install all packages
      - name: Install dependencies
        run: npm ci

      # Step 4: Build the app (creates the "dist" folder)
      # The Firebase config values are stored as GitHub Secrets (Settings → Secrets)
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Step 5: Authenticate to Google Cloud using the same FIREBASE_SERVICE_ACCOUNT
      # secret firebase-deploy.yml uses. Sets GOOGLE_APPLICATION_CREDENTIALS —
      # firebase-tools picks it up automatically, no --token flag needed.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Step 6: Deploy to Firebase Hosting (beta site only — not the main site).
      # Kept as its own step, before Storage below, so a Storage failure can
      # never cost the beta site its Hosting deploy — same isolation
      # reasoning firebase-deploy.yml already uses between its own Hosting
      # and Firestore/functions/storage steps.
      - name: Deploy to Firebase Hosting (beta)
        run: firebase deploy --only hosting:beta --project open-the-house

      # Step 7: Deploy Storage rules — the one project-wide exception this
      # workflow deploys (see file header). Added 2026-08-19, once the
      # project's Storage bucket was actually provisioned; kept isolated
      # from Hosting above for the same reason.
      - name: Deploy Storage rules
        run: firebase deploy --only storage --project open-the-house
